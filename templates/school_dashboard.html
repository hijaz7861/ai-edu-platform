<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Portal — AI Education Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container"><span class="navbar-brand mb-0 h1">AI Education Platform</span><span class="small text-secondary">{{ username }}</span></div>
  </nav>
  <main class="container py-4">
    <div class="card border-0 shadow-sm p-4">
      <h1 class="h3">{{ institution_name }}</h1>
      <p class="text-secondary mb-1">Signed in as {{ username }}</p>
      <p><span class="badge text-bg-primary">{{ role_name }}</span></p>
      <p class="mb-3">Your school account is restricted to its assigned institution. Available class data is tenant-scoped.</p>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-primary" href="/api/school/me">View account JSON</a>
        <a class="btn btn-outline-primary" href="/api/school/classes">View permitted classes</a>
      </div>
      <form class="mt-4" method="post" action="/auth/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-outline-secondary" type="submit">Sign out</button>
      </form>
    </div>
  </main>
</body>
</html>
