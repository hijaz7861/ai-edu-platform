<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Education Platform — Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card shadow-sm border-0 p-4" style="width:100%;max-width:420px">
      <h1 class="h3 text-center mb-2">AI Education Platform</h1>
      <p class="text-secondary text-center mb-4">Sign in to the administration portal</p>
      <form method="post" action="/auth/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control" autocomplete="username" required maxlength="120"></div>
        <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required maxlength="1024"></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="small text-secondary mt-3 mb-0">Access is available only after server credentials are configured.</p>
    </section>
  </main>
</body>
</html>
