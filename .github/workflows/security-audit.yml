name: Security Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/tenant-scoped-query-coverage]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit declared dependencies
        run: pip-audit --requirement requirements.txt
