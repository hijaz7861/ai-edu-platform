name: AI Education Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          tesseract --version

      - name: Syntax audit
        run: |
          python -m compileall -q app.py db.py services providers tests tools

      - name: Test suite
        run: |
          pytest -q

      - name: Production configuration check
        run: |
          test -f Procfile
          test -f render.yaml
          test -f .gitignore
          python - <<'PY'
          from pathlib import Path
          text = Path("Procfile").read_text()
          assert "gunicorn" in text
          assert "0.0.0.0" in text
          print("Production configuration: PASS")
          PY
